<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flight Wall API-test</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0f1f33;--line:rgba(255,255,255,.13);--muted:#9fb1c8;--text:#f5f8fc;--accent:#7dd3fc;--ok:#86efac;--bad:#fda4af}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px}.wrap{max-width:900px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.kpi{flex:1 1 140px;border:1px solid var(--line);border-radius:14px;padding:12px}.label{font-size:11px;color:var(--muted);letter-spacing:.08em}.value{font-size:24px;font-weight:700;margin-top:5px}.ok{color:var(--ok)}.bad{color:var(--bad)}button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:12px;padding:10px 14px;font:inherit}pre{white-space:pre-wrap;word-break:break-word;color:#dbeafe;font-size:13px;line-height:1.45}.plane{font-size:clamp(34px,8vw,72px);font-weight:800;color:var(--accent)}.small{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="small">Testposition: 59.633810, 17.915602 · exakt filter: 5,0 km · API-sökning: 3 NM</div>
    <div style="margin-top:12px"><button id="run">Kör test igen</button></div>
  </div>

  <div id="nearest" class="card" style="display:none">
    <div class="label">NÄRMASTE PLAN INOM 5 KM</div>
    <div id="flight" class="plane"></div>
    <div id="nearestInfo" class="small"></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="kpi"><div class="label">AIRPLANES.LIVE</div><div id="aplStatus" class="value">…</div></div>
      <div class="kpi"><div class="label">ADSB.LOL</div><div id="lolStatus" class="value">…</div></div>
      <div class="kpi"><div class="label">UNIKA PLAN</div><div id="total" class="value">0</div></div>
      <div class="kpi"><div class="label">INOM 5 KM</div><div id="inside" class="value">0</div></div>
    </div>
  </div>

  <div class="card">
    <div class="label">DIAGNOSTIK</div>
    <pre id="log"></pre>
  </div>
</div>
<script>
(()=>{
'use strict';
const CENTER={lat:59.633810,lon:17.915602};
const MAX_KM=5;
const RADIUS_NM=3;
const SOURCES=[
  {name:'Airplanes.live',id:'aplStatus',url:`https://api.airplanes.live/v2/point/${CENTER.lat}/${CENTER.lon}/${RADIUS_NM}`},
  {name:'ADSB.lol',id:'lolStatus',url:`https://api.adsb.lol/v2/point/${CENTER.lat}/${CENTER.lon}/${RADIUS_NM}`}
];
const $=id=>document.getElementById(id);
const logs=[];
function log(s){logs.push(`[${new Date().toLocaleTimeString('sv-SE')}] ${s}`);$('log').textContent=logs.join('\n')}
function rad(v){return v*Math.PI/180}
function dist(lat1,lon1,lat2,lon2){const R=6371.0088,dLat=rad(lat2-lat1),dLon=rad(lon2-lon1),a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function clean(v){return typeof v==='string'?v.trim():v}
function getAircraft(j){return Array.isArray(j?.ac)?j.ac:Array.isArray(j?.aircraft)?j.aircraft:[]}
async function fetchSource(s){
  $(s.id).textContent='…';$(s.id).className='value';
  const started=performance.now();
  try{
    const r=await fetch(s.url,{cache:'no-store'});
    const ms=Math.round(performance.now()-started);
    const text=await r.text();
    if(!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}; body=${text.slice(0,180)}`);
    let j; try{j=JSON.parse(text)}catch(e){throw new Error(`Ogiltig JSON: ${text.slice(0,180)}`)}
    const list=getAircraft(j);
    $(s.id).textContent=`OK · ${list.length}`;$(s.id).className='value ok';
    log(`${s.name}: OK ${r.status}, ${list.length} plan, ${ms} ms`);
    return list;
  }catch(e){
    $(s.id).textContent='FEL';$(s.id).className='value bad';
    log(`${s.name}: FEL — ${e.name}: ${e.message}`);
    log(`URL: ${s.url}`);
    return [];
  }
}
async function run(){
  logs.length=0;$('log').textContent='';$('nearest').style.display='none';$('total').textContent='0';$('inside').textContent='0';
  log(`Sidan körs från: ${location.protocol}//${location.host || '(lokal fil)'}`);
  log(`Origin: ${location.origin}`);
  log('Startar två direkta fetch-anrop från webbläsaren…');
  const results=await Promise.all(SOURCES.map(fetchSource));
  const byHex=new Map();
  for(const a of results.flat()){
    const key=clean(a.hex)||clean(a.icao)||clean(a.flight)||JSON.stringify([a.lat,a.lon,a.track]);
    if(!byHex.has(key)) byHex.set(key,a);
  }
  const all=[...byHex.values()];
  $('total').textContent=all.length;
  const withPos=all.filter(a=>Number.isFinite(a.lat)&&Number.isFinite(a.lon)).map(a=>({...a,_km:dist(CENTER.lat,CENTER.lon,a.lat,a.lon)}));
  const near=withPos.filter(a=>a._km<=MAX_KM).sort((a,b)=>a._km-b._km);
  $('inside').textContent=near.length;
  log(`Efter sammanslagning: ${all.length} unika plan; ${withPos.length} med lat/lon; ${near.length} inom 5,0 km.`);
  if(near.length){
    const a=near[0],cs=clean(a.flight)||clean(a.r)||clean(a.hex)||'OKÄNT';
    $('flight').textContent=cs;
    $('nearestInfo').textContent=`${a._km.toFixed(2).replace('.',',')} km bort · lat ${a.lat}, lon ${a.lon}`;
    $('nearest').style.display='block';
    log(`Närmaste: ${cs}, ${a._km.toFixed(3)} km.`);
  } else {
    log('Ingen träff inom 5 km i de data som webbläsaren lyckades hämta.');
  }
}
$('run').addEventListener('click',run);
run();
})();
</script>
</body>
</html>
